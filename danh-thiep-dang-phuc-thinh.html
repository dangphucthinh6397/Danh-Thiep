<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dang Phuc Thinh - Senior Trainer</title>
<style>
  :root{
    --bg:#002b69;
    --text:#000000;
    --card-bg:#ffffff;
    --accent:#002b69;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    font-family:'Segoe UI', Helvetica, Arial, sans-serif;
  }
  body{
    background:linear-gradient(160deg,var(--bg) 0%,#014a9c 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px env(safe-area-inset-right,16px) calc(24px + env(safe-area-inset-bottom,0px)) env(safe-area-inset-left,16px);
  }
  .card{
    background:var(--card-bg);
    width:100%;
    max-width:360px;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    text-align:center;
    animation:fadeUp .5s ease;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(16px);}
    to{opacity:1; transform:translateY(0);}
  }
  .cover{
    background:var(--bg);
    height:90px;
    position:relative;
  }
  .avatar-wrap{
    position:absolute;
    left:50%;
    top:90px;
    transform:translate(-50%,-50%);
    width:112px;
    height:112px;
    border-radius:50%;
    border:5px solid var(--card-bg);
    overflow:hidden;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .avatar-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .avatar-initials{
    color:#ffffff;
    font-size:42px;
    font-weight:700;
    letter-spacing:1px;
    user-select:none;
  }
  .content{
    padding:70px 24px 28px;
  }
  .name{
    font-size:22px;
    font-weight:700;
    color:var(--text);
    margin-bottom:4px;
  }
  .title{
    font-size:15px;
    font-weight:600;
    color:var(--bg);
    margin-bottom:2px;
  }
  .org{
    font-size:13px;
    color:#555;
    margin-bottom:18px;
  }
  .tagline{
    font-size:14px;
    font-style:italic;
    color:var(--text);
    line-height:1.5;
    padding:14px 12px;
    background:#f4f6fb;
    border-radius:12px;
    margin-bottom:20px;
  }
  .tagline .author{
    display:block;
    margin-top:6px;
    font-style:normal;
    font-weight:600;
    font-size:12.5px;
    color:var(--bg);
  }
  .info{
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:24px;
  }
  .info-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13.5px;
    color:var(--text);
  }
  .info-row .icon{
    flex:0 0 30px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--bg);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
  }
  .info-row span.val{
    word-break:break-word;
  }
  .save-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--bg);
    color:#ffffff;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    letter-spacing:.3px;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    box-shadow:0 8px 18px rgba(0,43,105,0.35);
  }
  .save-btn:active{
    transform:scale(0.97);
  }
  .save-btn:hover{
    background:#013e8f;
  }
</style>
</head>
